[alembic]
# Scheduling's OWN migration tree (database-per-service): a fresh baseline for
# scheduling_db containing only provider_slots. Run from the repo root:
#   alembic -c services/scheduling/migrations/alembic.ini upgrade head
script_location = %(here)s

# Version file naming: revision id + slug, e.g. scheduling_0001_provider_slots.py
file_template = %%(rev)s_%%(slug)s

# Repo root on sys.path so env.py can import `services.*` / `libs.*`.
prepend_sys_path = %(here)s/../../..

# sqlalchemy.url is intentionally left unset — env.py reads the async engine
# URL from services.scheduling.config.settings.database_url
# (SCHEDULING_DATABASE_URL) so app config and migration config never drift apart.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
