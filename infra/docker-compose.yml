name: smarthealth

# Full local-dev stack for SmartHealth Part A. Postgres/Mongo/Redis are the
# application's live dependencies (Phase 1). Kafka/Schema-Registry/RabbitMQ/
# Temporal/Jaeger/Prometheus/Grafana were scaffolding in Phase 1. From Phase 2
# Temporal is live: the scheduling and visit APIs start workflows on it and the
# scheduling-worker / visit-worker containers execute them. Kafka/RabbitMQ stay
# scaffolding until Phase 3.

# --- Shared building blocks for the application services (YAML anchors) ------
# Every application container gets the same container-network URLs for the
# shared stores (literal, NOT ${...}-interpolated: a host-oriented value in a
# developer's .env, e.g. localhost:6380, must never leak into a container), the
# same python-only healthcheck (the slim image has no curl) and the same
# startup gate: db-init has finished and the stores are healthy.
x-app-env: &app-env
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB_NAME: ${MONGO_DB_NAME:-smarthealth}
  REDIS_URL: redis://redis:6379/0
  OTLP_ENDPOINT: http://jaeger:4317

x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-app-depends-on: &app-depends-on
  db-init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  mongo:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:15-trixie
    # One server hosts the five service databases AND Temporal's two. Temporal
    # alone holds ~40 connections at idle and each application worker keeps its
    # own SQLAlchemy pool (default 5 + 10 overflow), so the stock limit of 100 is
    # exhausted by a normal local run (TooManyConnectionsError). 300 leaves
    # headroom without changing any data.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthealth} -d ${POSTGRES_DB:-smarthealth}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot, idempotent database-per-service bootstrap (D-01): creates a
  # role + database per service and revokes PUBLIC access. A job (not
  # /docker-entrypoint-initdb.d) because init scripts only run on an EMPTY data
  # directory and would silently do nothing on an existing volume. Safe to
  # re-run; leaves the legacy single database untouched.
  db-init:
    image: postgres:15-trixie
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-smarthealth}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme-local-dev-only}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-changeme-identity-local-dev-only}
      ORGANIZATION_DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD:-changeme-organization-local-dev-only}
      PROVIDER_DB_PASSWORD: ${PROVIDER_DB_PASSWORD:-changeme-provider-local-dev-only}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD:-changeme-patient-local-dev-only}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:-changeme-scheduling-local-dev-only}
      VISIT_DB_PASSWORD: ${VISIT_DB_PASSWORD:-changeme-visit-local-dev-only}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:-changeme-billing-local-dev-only}
    volumes:
      - ./postgres-init:/postgres-init:ro
    entrypoint: ["bash", "/postgres-init/create-service-databases.sh"]
    restart: "no"

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-smarthealth}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # CLAUDE.md pins redis:8.2-trixie, but that exact tag does not exist on
    # Docker Hub (verified live against the registry this session) — using
    # 8.2-bookworm, the same 8.2 minor line CLAUDE.md intended, just the
    # correct Debian codename tag Redis actually publishes.
    image: redis:8.2-bookworm
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smarthealth}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme-local-dev-only}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Kafka in KRaft mode (broker + controller combined single-node) — no
  # ZooKeeper service. CLUSTER_ID is a fixed base64 UUID, required for a
  # KRaft-mode single-node broker to bootstrap deterministically across
  # `docker compose up` re-runs.
  kafka:
    image: confluentinc/cp-kafka:7.6.13
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Fixed base64 UUID (24 chars) — required for KRaft single-node bootstrap.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Same Confluent Platform version line as kafka (7.6.13) — mixing CP image
  # lines is a known source of wire-protocol/compatibility issues.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.13
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # Points at Kafka's INTERNAL compose-network listener (kafka:29092),
      # not the host-mapped localhost:9092 — that only resolves from the host.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "${SCHEMA_REGISTRY_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # NON-PRODUCTION convenience image per CLAUDE.md's "What NOT to Use" table —
  # auto-provisions Temporal's schema on first boot. Production would use
  # temporalio/server + a dedicated schema-setup job/container instead.
  temporal:
    # CLAUDE.md pins temporalio/auto-setup:1.31.2, but that tag does not
    # exist on Docker Hub (verified live against the registry this session —
    # highest available auto-setup tag is 1.29.7). Using the closest
    # available release in the same 1.2x line CLAUDE.md intended.
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-changeme-local-dev-only}
      POSTGRES_SEEDS: postgres
    ports:
      - "${TEMPORAL_HOST_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8080}:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686" # Jaeger query UI
      - "${JAEGER_OTLP_GRPC_HOST_PORT:-4317}:4317" # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_HOST_PORT:-4318}:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.13.3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.0.8
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-changeme-local-dev-only}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus

  # Identity: accounts, token issuance, JWKS. The only service that holds the
  # RSA private key. No host port: reached through the gateway (/api/auth,
  # /api/admin, /.well-known/jwks.json) or, for JWKS and /internal lookups, by
  # other services over the Compose network.
  identity:
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      IDENTITY_DATABASE_URL: postgresql+asyncpg://identity_svc:${IDENTITY_DB_PASSWORD:-changeme-identity-local-dev-only}@postgres:5432/identity_db
      # Fail-closed signing key: Identity refuses to start without it. The key is
      # delivered ONLY to this container, as a Compose secret (never baked into an
      # image, never in an env var, never given to any other service).
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-smarthealth-identity-1}
      # Service-token mint (plan 02-01, D-06): Identity reads `<client>.secret`
      # from this directory for every client named in SERVICE_TOKEN_AUDIENCES.
      # The files arrive as Compose secrets, never as env values or image content.
      # Billing calls no other service, so it has no secret here.
      SERVICE_CLIENT_SECRETS_DIR: /run/secrets
    depends_on: *app-depends-on
    healthcheck: *app-healthcheck
    secrets:
      - source: jwt_private_key
        target: jwt_private.pem
      - source: scheduling_client_secret
        target: scheduling.secret
      - source: visit_client_secret
        target: visit.secret

  # Organization: clinics and departments. No host port; reached via the gateway.
  organization:
    build:
      context: ..
      dockerfile: services/organization/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      ORGANIZATION_DATABASE_URL: postgresql+asyncpg://organization_svc:${ORGANIZATION_DB_PASSWORD:-changeme-organization-local-dev-only}@postgres:5432/organization_db
    depends_on: *app-depends-on
    healthcheck: *app-healthcheck

  # Provider: providers, specialties, availability templates. No host port.
  provider:
    build:
      context: ..
      dockerfile: services/provider/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      PROVIDER_DATABASE_URL: postgresql+asyncpg://provider_svc:${PROVIDER_DB_PASSWORD:-changeme-provider-local-dev-only}@postgres:5432/provider_db
    depends_on: *app-depends-on
    healthcheck: *app-healthcheck

  # Patient: patient profiles. No host port.
  patient:
    build:
      context: ..
      dockerfile: services/patient/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      PATIENT_DATABASE_URL: postgresql+asyncpg://patient_svc:${PATIENT_DB_PASSWORD:-changeme-patient-local-dev-only}@postgres:5432/patient_db
    depends_on: *app-depends-on
    healthcheck: *app-healthcheck

  # Gateway: the single ingress for external traffic and the ONLY application
  # service with a host port. It has no /internal route, so /internal/* is
  # unreachable from outside. Service URLs need no env entries: SharedSettings
  # defaults already use the Compose DNS names (http://identity:8000, ...).
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      GATEWAY_RATE_LIMIT_DEFAULT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_DEFAULT_PER_MINUTE:-300}
      GATEWAY_RATE_LIMIT_AUTH_PER_MINUTE: ${GATEWAY_RATE_LIMIT_AUTH_PER_MINUTE:-20}
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:8000"
    depends_on:
      identity:
        condition: service_healthy
      organization:
        condition: service_healthy
      provider:
        condition: service_healthy
      patient:
        condition: service_healthy
      scheduling:
        condition: service_healthy
      visit:
        condition: service_healthy
      billing:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *app-healthcheck

  # Scheduling (D-03): slots, appointments, waitlist and the booking /
  # cancel / reschedule / waitlist-advance sagas' API side. Reached through the
  # gateway (/api/slots, /api/appointments, /api/waitlist); no host port. The
  # API starts workflows on Temporal and authenticates its /internal calls with
  # its own client secret (a Compose secret, D-06). It runs Alembic on start.
  scheduling:
    build:
      context: ..
      dockerfile: services/scheduling/Dockerfile
    env_file:
      - path: .env
        required: false
    environment: &scheduling-env
      <<: *app-env
      SCHEDULING_DATABASE_URL: postgresql+asyncpg://scheduling_svc:${SCHEDULING_DB_PASSWORD:-changeme-scheduling-local-dev-only}@postgres:5432/scheduling_db
      SCHEDULING_CLIENT_SECRET_PATH: /run/secrets/scheduling.secret
      SCHEDULING_HOLD_TTL_MINUTES: ${SCHEDULING_HOLD_TTL_MINUTES:-10}
      SCHEDULING_CANCEL_CUTOFF_HOURS: ${SCHEDULING_CANCEL_CUTOFF_HOURS:-24}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: *app-depends-on
    healthcheck: *app-healthcheck
    secrets: &scheduling-secrets
      - source: scheduling_client_secret
        target: scheduling.secret

  # Scheduling's Temporal worker (D-05): same image, separate process. Polls
  # scheduling-tq, registers the hold-reaper / pending-starter Schedules, and
  # never runs migrations: it starts only once the API is healthy, i.e. after
  # Alembic. No HTTP listener, so liveness is a heartbeat file the worker
  # touches every 10 s (stale after 30 s = unhealthy).
  scheduling-worker:
    build:
      context: ..
      dockerfile: services/scheduling/Dockerfile
    command: ["python", "-m", "services.scheduling.worker"]
    env_file:
      - path: .env
        required: false
    environment: *scheduling-env
    depends_on:
      scheduling:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mongo:
        condition: service_healthy
    secrets: *scheduling-secrets
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/scheduling-worker.alive') < 30 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Billing (D-10): simulated pre-check and the billing record state machine.
  # Answers Scheduling and Visit only (/internal/billing/*) plus a read-only
  # /api/billing route; calls no other service, so no client secret. A
  # coverage_ref starting with BILLING_PRECHECK_FAIL_PREFIX is denied.
  billing:
    build:
      context: ..
      dockerfile: services/billing/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      BILLING_DATABASE_URL: postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD:-changeme-billing-local-dev-only}@postgres:5432/billing_db
      BILLING_PRECHECK_FAIL_PREFIX: ${BILLING_PRECHECK_FAIL_PREFIX:-DENY-}
    depends_on: *app-depends-on
    healthcheck: *app-healthcheck

  # Visit (D-15/D-16): check-in -> start -> complete; a completion starts the
  # VisitCompletedWorkflow after its commit. Reached via /api/visits; no host port.
  visit:
    build:
      context: ..
      dockerfile: services/visit/Dockerfile
    env_file:
      - path: .env
        required: false
    environment: &visit-env
      <<: *app-env
      VISIT_DATABASE_URL: postgresql+asyncpg://visit_svc:${VISIT_DB_PASSWORD:-changeme-visit-local-dev-only}@postgres:5432/visit_db
      VISIT_CLIENT_SECRET_PATH: /run/secrets/visit.secret
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: *app-depends-on
    healthcheck: *app-healthcheck
    secrets: &visit-secrets
      - source: visit_client_secret
        target: visit.secret

  # Visit's Temporal worker (D-05): polls visit-tq (downstream fan-out after a
  # completion) and registers the visit-downstream-sweeper Schedule. Same
  # heartbeat liveness as scheduling-worker.
  visit-worker:
    build:
      context: ..
      dockerfile: services/visit/Dockerfile
    command: ["python", "-m", "services.visit.worker"]
    env_file:
      - path: .env
        required: false
    environment: *visit-env
    depends_on:
      visit:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mongo:
        condition: service_healthy
    secrets: *visit-secrets
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/visit-worker.alive') < 30 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  prometheus_data:
  grafana_data:

# The RSA private key. Generated by scripts/generate_jwt_keypair.py (gitignored);
# Compose refuses to start `identity` when the file is missing, so there is no
# insecure fallback. Only the identity service lists this secret.
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  # Per-service client secrets for the service-token mint (plan 02-01, D-06),
  # written by scripts/generate_service_secrets.py into the gitignored
  # infra/secrets/service-clients/. Identity gets both; each caller only its own.
  scheduling_client_secret:
    file: ./secrets/service-clients/scheduling.secret
  visit_client_secret:
    file: ./secrets/service-clients/visit.secret
