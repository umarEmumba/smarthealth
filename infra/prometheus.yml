global:
  scrape_interval: 15s

# One scrape job per process (plan 03-15, OBS-01); every target is reached over the
# Compose network and none of the ports below is published to the host (static test
# tests/infra/test_prometheus_config.py):
#   * HTTP APIs expose /metrics on :8000 and report their own OTel service name,
#     smarthealth-<service>. The gateway is the exception: it is the only published
#     application port, so its /metrics is served on an internal-only listener (:9100)
#     and is a 404 on :8000.
#   * Temporal workers serve application metrics on :9100 (prometheus_client) and the
#     Temporal SDK's own metrics (temporal_*) on :9464, both under one job.
#   * Kafka consumers and the Celery worker serve /metrics on :9100.
#   * RabbitMQ serves the rabbitmq_prometheus plugin on :15692.
scrape_configs:
  - job_name: "smarthealth-gateway"
    static_configs:
      - targets: ["gateway:9100"]

  - job_name: "smarthealth-identity"
    static_configs:
      - targets: ["identity:8000"]

  - job_name: "smarthealth-organization"
    static_configs:
      - targets: ["organization:8000"]

  - job_name: "smarthealth-provider"
    static_configs:
      - targets: ["provider:8000"]

  - job_name: "smarthealth-patient"
    static_configs:
      - targets: ["patient:8000"]

  - job_name: "smarthealth-scheduling"
    static_configs:
      - targets: ["scheduling:8000"]

  - job_name: "smarthealth-billing"
    static_configs:
      - targets: ["billing:8000"]

  - job_name: "smarthealth-visit"
    static_configs:
      - targets: ["visit:8000"]

  - job_name: "smarthealth-scheduling-worker"
    static_configs:
      - targets: ["scheduling-worker:9100", "scheduling-worker:9464"]

  # --- Phase 3 (plan 03-15): analytics, the other Temporal workers, consumers, Celery, RabbitMQ ---
  - job_name: "smarthealth-analytics"
    static_configs:
      - targets: ["analytics:8000"]

  - job_name: "smarthealth-visit-worker"
    static_configs:
      - targets: ["visit-worker:9100", "visit-worker:9464"]

  - job_name: "smarthealth-notification-temporal-worker"
    static_configs:
      - targets: ["notification-temporal-worker:9100", "notification-temporal-worker:9464"]

  - job_name: "smarthealth-visit-consumer"
    static_configs:
      - targets: ["visit-consumer:9100"]

  - job_name: "smarthealth-analytics-consumer"
    static_configs:
      - targets: ["analytics-consumer:9100"]

  - job_name: "smarthealth-notification-consumer"
    static_configs:
      - targets: ["notification-consumer:9100"]

  - job_name: "smarthealth-notification-celery"
    static_configs:
      - targets: ["notification-celery:9100"]

  # RabbitMQ's own rabbitmq_prometheus plugin (queue depth, including the dead-letter queue).
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
