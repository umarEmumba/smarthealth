global:
  scrape_interval: 15s

# One scrape job per application service (each exposes /metrics on :8000 inside
# the Compose network and reports its own OTel service name, smarthealth-<service>).
scrape_configs:
  - job_name: "smarthealth-gateway"
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: "smarthealth-identity"
    static_configs:
      - targets: ["identity:8000"]

  - job_name: "smarthealth-organization"
    static_configs:
      - targets: ["organization:8000"]

  - job_name: "smarthealth-provider"
    static_configs:
      - targets: ["provider:8000"]

  - job_name: "smarthealth-patient"
    static_configs:
      - targets: ["patient:8000"]

  - job_name: "smarthealth-scheduling"
    static_configs:
      - targets: ["scheduling:8000"]
