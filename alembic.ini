[alembic]
# Migrations live under infra/migrations, not the default ./alembic — keeps
# infra-adjacent tooling grouped together per the project structure.
script_location = infra/migrations

# Version file naming: revision id + slug, matches infra/migrations/versions/0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally left unset here — env.py reads the async
# engine URL from smarthealth.config.settings.database_url so app config and
# migration config never drift apart (single source of truth).
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
